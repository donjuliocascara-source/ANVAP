<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 176" width="100%" height="100%">
  <rect width="320" height="176" fill="#FFFFFF" />

  <defs>
    <!-- Grano individual puntiagudo (forma de gota/espiga real) -->
    <path
      id="grano-izq"
      d="M -0.8 0 C -1.2 -3.2, -3.8 -7.5, -7.2 -10.8 C -5.8 -4.8, -3.5 -1.2, -0.8 0 Z"
      fill="#FDB813"
    />
    <path
      id="grano-der"
      d="M 0.8 0 C 1.2 -3.2, 3.8 -7.5, 7.2 -10.8 C 5.8 -4.8, 3.5 -1.2, 0.8 0 Z"
      fill="#FDB813"
    />
    <!-- Par de granos compactos de espiga -->
    <g id="par-espiga" fill="#FDB813">
      <!-- Grano izquierdo relleno con punta fina -->
      <path d="M -0.7 0.5 C -4.2 -1.2, -6.2 -5.2, -6.8 -10.5 C -3.4 -7.5, -1.2 -4.0, -0.7 0.5 Z" />
      <!-- Grano derecho relleno con punta fina -->
      <path d="M 0.7 0.5 C 4.2 -1.2, 6.2 -5.2, 6.8 -10.5 C 3.4 -7.5, 1.2 -4.0, 0.7 0.5 Z" />
    </g>

    <!-- Espiga completa de 5 pares + grano apical con arista -->
    <g id="espiga-completa" fill="#FDB813">
      <!-- Tallo central -->
      <path d="M -0.7 0 L -0.35 -54 L 0 -64 L 0.35 -54 L 0.7 0 Z" />
      <!-- Grano central superior con punta alargada -->
      <path d="M 0 -63 C -2.3 -55, -2.3 -48, 0 -44 C 2.3 -48, 2.3 -55, 0 -63 Z" />
      <!-- 5 pares de granos escalonados -->
      <use href="#par-espiga" transform="translate(0, -42) scale(0.84)" />
      <use href="#par-espiga" transform="translate(0, -34) scale(0.94)" />
      <use href="#par-espiga" transform="translate(0, -25.5) scale(1.0)" />
      <use href="#par-espiga" transform="translate(0, -17) scale(0.98)" />
      <use href="#par-espiga" transform="translate(0, -8.5) scale(0.90)" />
    </g>
  </defs>

  <!-- ==================== 5 ESPIGAS CON BASES SEPARADAS EN ARCO ==================== -->
  <!-- 1. Espiga Exterior Izquierda -->
  <use href="#espiga-completa" transform="translate(122, 74) rotate(-14) scale(0.78)" />
  <!-- 2. Espiga Intermedia Izquierda -->
  <use href="#espiga-completa" transform="translate(141, 76) rotate(-7) scale(0.90)" />
  <!-- 3. Espiga Central (Más alta) -->
  <use href="#espiga-completa" transform="translate(160, 77) rotate(0) scale(1.02)" />
  <!-- 4. Espiga Intermedia Derecha -->
  <use href="#espiga-completa" transform="translate(179, 76) rotate(7) scale(0.90)" />
  <!-- 5. Espiga Exterior Derecha -->
  <use href="#espiga-completa" transform="translate(198, 74) rotate(14) scale(0.78)" />

  <!-- ==================== HOJAS BASALES DORADAS Y VERDE ==================== -->
  <!-- Hoja basal dorada izquierda -->
  <path
    d="M 159.5 80 C 142 79, 114 72, 86 64 C 108 76, 134 85, 159.5 84.5 Z"
    fill="#FDB813"
  />
  <!-- Hoja basal dorada derecha -->
  <path
    d="M 160.5 80 C 178 79, 206 72, 234 64 C 212 76, 186 85, 160.5 84.5 Z"
    fill="#FDB813"
  />
  <!-- Hoja curva verde inferior derecha -->
  <path
    d="M 142 86.5 C 166 90.5, 200 83, 232 69.5 C 206 86.5, 172 93.5, 142 86.5 Z"
    fill="#006837"
  />

  <!-- ==================== TEXTO "MOLINO" ==================== -->
  <text
    x="160"
    y="129"
    text-anchor="middle"
    fill="#006837"
    stroke="#006837"
    stroke-width="1.2"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-weight="bold"
    font-size="45"
    textLength="226"
    lengthAdjust="spacingAndGlyphs"
  >
    MOLINO
  </text>

  <!-- ==================== BARRAS LATERALES VERDES Y "Don Julio" ==================== -->
  <rect x="47" y="147" width="54" height="5.5" fill="#006837" />
  <rect x="219" y="147" width="54" height="5.5" fill="#006837" />

  <text
    x="160"
    y="157"
    text-anchor="middle"
    fill="#FDB813"
    stroke="#FDB813"
    stroke-width="0.4"
    font-family="'Brush Script MT', 'Monotype Corsiva', 'Segoe Script', 'Palatino Linotype', Georgia, cursive"
    font-style="italic"
    font-weight="bold"
    font-size="29"
  >
    Don Julio
  </text>
</svg>
